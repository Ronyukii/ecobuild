name: EcoBuild Daily Market Price Sync

on:
  schedule:
    # Runs at 18:00 UTC every day, which is 02:00 AM Malaysia Time (GMT+8)
    - cron: '0 18 * * *'
  # Allows you to manually trigger the scraper anytime from GitHub's UI for testing
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Global Scraper Pipeline
        env:
          SQLALCHEMY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: backend
        run: |
          python -m app.scraper