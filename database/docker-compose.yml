version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: ecobuild_postgres
    restart: always
    environment:
      POSTGRES_USER: ecobuild_user
      POSTGRES_PASSWORD: ecobuild_password
      POSTGRES_DB: ecobuild_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: